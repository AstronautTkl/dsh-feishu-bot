- insert:
    - id: dsh-feishu-bot
      name: dsh-feishu-bot
      config:
        # 飞书开放平台 → 自建应用 →「凭证与基础信息」里的 App ID。
        # 留空时插件不会启动，只在日志里提示。
        appId: ''
        # 建议把 App Secret 存成 DSH 凭据（DSH_FEISHU_APP_SECRET），不要写在这里。
        # 本地开发也可以写 settings.local.json（已在 .gitignore 里）。
        approvalScope: all
        approvalTimeoutMs: 300000
        onTimeout: delegate
        bindMode: code
        notify: true
