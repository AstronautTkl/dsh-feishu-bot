name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests
        # 不带路径：让测试运行器按默认规则发现 test/*.test.mjs。
        # `node --test test/` 在 Node 22 上会被当成模块路径而报 Cannot find module。
        run: node --test
